# /etc/sysctl.d/99-hardening.conf
# Kernel and network hardening for the DMZ web server. Apply with: sudo sysctl --system

# Drop packets with spoofed source addresses
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1

# Do not let ICMP redirects change this server's routes
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv6.conf.all.accept_redirects=0
net.ipv4.conf.all.send_redirects=0

# Log packets with impossible source addresses
net.ipv4.conf.all.log_martians=1

# Hide kernel pointers and restrict kernel logs to root
kernel.kptr_restrict=2
kernel.dmesg_restrict=1

# No core dumps from privileged programs
fs.suid_dumpable=0
